[project]
name = "mama-backend"
version = "0.1.0"
description = "MAMA backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "alembic>=1.16,<2",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mysql: requires a dedicated MySQL test database"]

[tool.fastapi]
entrypoint = "main:app"
