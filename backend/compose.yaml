name: mama

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mama
      MYSQL_USER: mama
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u mama -D mama -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 40

  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: local-test-root-only
      MYSQL_DATABASE: mama_test
      MYSQL_USER: mama_test
      MYSQL_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-3308}:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u mama_test -D mama_test -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 40

  postgres-test:
    image: postgres:17
    profiles: [postgres-test]
    environment:
      POSTGRES_DB: mama_pg_test
      POSTGRES_USER: mama_test
      POSTGRES_PASSWORD: local-pg-test-only
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mama_test -d mama_pg_test"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
  mysql_test_data:
  postgres_test_data:
